[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-hipotesis"
version = "1.1.0"
description = "Laboratorio virtual para contrastar hipótesis cuantitativas con un protocolo fijo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
lab = "lab.cli:main"

[project.urls]
Homepage = "https://github.com/MiltonREB/lab-hipotesis"
Repository = "https://github.com/MiltonREB/lab-hipotesis"
Issues = "https://github.com/MiltonREB/lab-hipotesis/issues"

[tool.setuptools]
packages = ["lab", "hipotesis"]
