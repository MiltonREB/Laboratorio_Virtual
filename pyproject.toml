[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-hipotesis"
version = "1.1.0"
description = "Laboratorio virtual para contrastar hipótesis cuantitativas con un protocolo fijo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools]
packages = ["lab", "hipotesis"]
